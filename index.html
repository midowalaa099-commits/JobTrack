  const date = new Date(year, month - 1, day);

}

function parseBackup(text) {

    ids.add(record.id);

function toCSV(records) {
  const keys = ['company','role','stage','location','workMode','source','appliedDate','followUpDate','interviewAt','salaryMin','salaryMax','contactName','contactEmail','url','notes'];

function detail(record){
 const definition=(label,value)=>`<div><dt>${label}</dt><dd>${value}</dd></div>`;
 showDialog(text('Application details','تفاصيل التقديم'),`<div class="detail-heading">${logo(record,true)}<div><h3>${escapeHTML(record.company)}</h3><p>${escapeHTML(record.role)}</p></div></div><div class="section-gap">${badge(record.stage)}</div><dl class="detail-grid">${definition(text('Work arrangement','طريقة العمل'),modeLabel(record.workMode))}${definition(text('Location','المكان'),escapeHTML(record.location||text('Not specified','مش محدد')))}${definition(text('Application date','تاريخ التقديم'),prettyDate(record.appliedDate))}${definition(text('Follow up','المتابعة'),prettyDate(record.followUpDate))}${definition(text('Interview','المقابلة'),prettyDate(record.interviewAt,true))}${definition(text('Monthly salary (EGP)','راتب شهري (جنيه)'),salaryLabel(record))}${definition(text('Source','المصدر'),escapeHTML(record.source||'—'))}${definition(text('Contact','مسؤول التواصل'),escapeHTML([record.contactName,record.contactEmail].filter(Boolean).join(' · ')||'—'))}</dl>${record.url?`<a class="app-url tiny" href="${escapeHTML(record.url)}" target="_blank" rel="noopener noreferrer">${icon('link')} ${text('Open job listing','افتح إعلان الوظيفة')} ↗</a>`:''}<p class="details-label">${text('Your notes','ملاحظاتك')}</p><div class="note-box">${escapeHTML(record.notes||text('No notes yet. Add a small next step.','مفيش ملاحظات لسه. ضيف الخطوة الجاية.'))}</div><form data-form="stage" class="stage-control"><input type="hidden" name="id" value="${record.id}"><label for="detail-stage">${text('Move to stage','انقل لمرحلة')}</label><select name="stage" id="detail-stage">${STAGES.map(stage=>`<option value="${stage}" ${record.stage===stage?'selected':''}>${stageLabel(stage)}</option>`).join('')}</select><button type="submit" class="button small">${text('Update stage','حدّث المرحلة')}</button></form><div class="form-actions">${btn(text('Delete','احذف'),'delete',record.id,'danger','trash')}${btn(text('Edit application','عدّل التقديم'),'edit',record.id,'primary','edit')}</div>`);
}
function confirmWorkspace(mode){showDialog(mode==='personal'?text('Start with a clean page?','نبدأ صفحة جديدة؟'):text('Restore the demo workspace?','نرجّع المساحة التجريبية؟'),`<p class="form-help">${text('This replaces every application currently saved in this browser. Export a JSON backup first if you want to keep them.','ده هيستبدل كل التقديمات المحفوظة في المتصفح. صدّر نسخة JSON الأول لو عاوز تحتفظ بيها.')}</p><div class="choice-box"><p>${text('Current applications:','التقديمات الحالية:')} <strong>${number(records.length)}</strong></p><p>${text('New workspace:','المساحة الجديدة:')} <strong>${mode==='personal'?text('Empty, ready for your search','فاضية وجاهزة لتقديماتك'):text('10 fictional sample applications','١٠ تقديمات وهمية للتجربة')}</strong></p></div><div class="actions">${btn(text('Export backup first','صدّر نسخة الأول'),'backup','','','download')}${btn(text('Keep current workspace','خلّي البيانات الحالية'),'close')}${btn(text('Replace workspace','استبدل مساحة العمل'),'confirm-workspace',mode,'primary')}</div>`);}
function changeFilter(key,value){if(key==='query')query=value;if(key==='stage')stageFilter=value;if(key==='mode')modeFilter=value;if(key==='sort')sortOrder=value;pageIndex=0;render();}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
 const {action,id}=target.dataset,record=records.find(item=>item.id===id);
 try {
  if(action==='close')return closeDialog();
  if(action==='add')return editor();
  if(action==='edit'&&record)return editor(record);
  if(action==='detail'&&record)return detail(record);
  if(action==='language'){language=language==='en'?'ar':'en';try{localStorage.setItem(PREF_KEY,language);}catch{}closeDialog();return render();}
  if(action==='quick'){quickFilter=id;pageIndex=0;return render();}
  if(action==='previous'){pageIndex=Math.max(0,pageIndex-1);return render();}
  if(action==='next'){pageIndex=Math.min(Math.ceil(selectedRecords().length/PAGE_SIZE)-1,pageIndex+1);return render();}
  if(action==='csv'){download(`JobTrack-${todayISO()}.csv`,toCSV(selectedRecords()),'text/csv;charset=utf-8');return toast(text('Filtered applications exported as CSV.','صدّرنا التقديمات حسب الفلاتر الحالية كـ CSV.'));}
  if(action==='backup'){download(`JobTrack-backup-${todayISO()}.json`,JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),workspaceMode,applications:records},null,2),'application/json');return toast(text('Backup downloaded. Keep it somewhere safe.','نزّلنا النسخة الاحتياطية. احفظها في مكان آمن.'));}
  if(action==='recovery'&&recoveryText){return download('JobTrack-recovery-original.json',recoveryText,'application/json');}
  if(action==='import'){document.getElementById('import-file').value='';return document.getElementById('import-file').click();}
  if(action==='confirm-import'&&pendingImport){records=pendingImport;pendingImport=null;workspaceMode='personal';storageIssue=storageIssue==='corrupt'?'':storageIssue;recoveryText='';closeDialog();return saveWorkspace(text('Your backup has been restored.','رجّعنا النسخة الاحتياطية.'));}
  if(action==='empty-workspace')return confirmWorkspace('personal');
  if(action==='restore-demo')return confirmWorkspace('demo');
  if(action==='confirm-workspace'&&['personal','demo'].includes(id)){records=id==='demo'?sampleApplications():[];workspaceMode=id;storageIssue='';recoveryText='';query='';stageFilter='all';modeFilter='all';quickFilter='all';pageIndex=0;closeDialog();return saveWorkspace(text('Workspace ready. Here’s to your next chapter.','مساحة العمل جاهزة لخطوتك الجاية.'));}
  if(action==='delete'&&record)return showDialog(text('Delete this application?','نحذف التقديم ده؟'),`<div class="choice-box"><h3>${escapeHTML(record.company)}</h3><p>${escapeHTML(record.role)}</p></div><p class="form-help">${text('This removes the application and its notes from this browser. Keep a backup if you may need it later.','ده بيحذف التقديم وملاحظاته من المتصفح. احتفظ بنسخة لو ممكن تحتاجه بعدين.')}</p><div class="form-actions">${btn(text('Keep application','خلّي التقديم'),'close')}${btn(text('Delete application','احذف التقديم'),'confirm-delete',id,'danger','trash')}</div>`);
  if(action==='confirm-delete'&&record){records=records.filter(item=>item.id!==id);closeDialog();return saveWorkspace(text('Application deleted.','حذفنا التقديم.'));}
 } catch(error){showError(error);}
});
document.addEventListener('submit',event=>{
 if(!(event.target instanceof HTMLFormElement)||!event.target.dataset.form)return;
 event.preventDefault();const values=Object.fromEntries(new FormData(event.target));
 try{
  if(event.target.dataset.form==='application'){
   const previous=records.find(record=>record.id===values.id);
   records=putApplication(records,{...previous,...values});
   closeDialog();saveWorkspace();
  }
  if(event.target.dataset.form==='stage'){
   const record=records.find(item=>item.id===values.id);if(!record)return;
   records=putApplication(records,{...record,stage:values.stage});
   saveWorkspace(text('Stage updated. A little progress.','حدّثنا المرحلة. خطوة لقدّام.'));detail(records.find(item=>item.id===values.id));
  }
 }catch(error){showError(error);}
});
document.addEventListener('input',event=>{if(event.target.dataset.filter==='query')changeFilter('query',event.target.value);});
document.addEventListener('change',async event=>{
 if(event.target.dataset.filter&&event.target.dataset.filter!=='query')changeFilter(event.target.dataset.filter,event.target.value);
 if(event.target.id!=='import-file')return;
 const file=event.target.files?.[0];if(!file)return;
 try{
  if(file.size>1500000)throw Error('fileSize');
  pendingImport=parseBackup(await file.text());
  showDialog(text('Restore this backup?','نرجّع النسخة دي؟'),`<div class="choice-box"><p>${text('Applications in the backup:','التقديمات في النسخة:')} <strong>${number(pendingImport.length)}</strong></p><p>${text('Applications being replaced:','التقديمات اللي هتتستبدل:')} <strong>${number(records.length)}</strong></p></div><p class="form-help">${text('The file passed validation. Restoring it replaces all current applications. The file is processed on your device only.','الملف اجتاز المراجعة. الاسترجاع بيستبدل التقديمات الحالية كلها. الملف بيتعالج على جهازك بس.')}</p><div class="form-actions">${btn(text('Cancel','إلغاء'),'close')}${btn(text('Replace & restore','استبدل واسترجع'),'confirm-import','','primary')}</div>`);
 }catch(error){pendingImport=null;showError(error);}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){document.getElementById('main').focus();return;}closeDialog();pageIndex=0;render();document.getElementById('main').focus();window.scrollTo(0,0);});
document.getElementById('dialog').addEventListener('close',()=>{if(dialogOpener?.isConnected)dialogOpener.focus();});
render();
</script>
</body>
</html>
